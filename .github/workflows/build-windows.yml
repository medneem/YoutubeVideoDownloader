name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Bump the minor release line here; the last component is github.run_number.
env:
  BASE_VERSION: "0.1"

permissions:
  contents: read

jobs:
  windows-portable:
    name: Windows x64 portable ZIP
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Stamp version from GitHub Actions run number
        shell: pwsh
        run: |
          python scripts/stamp_version.py "$env:BASE_VERSION" "$env:GITHUB_RUN_NUMBER"
          python -c "from version import APP_VERSION; print('Building version:', APP_VERSION)"

      - name: Validate source and run unit tests
        run: |
          python -m compileall -q main.py downloader.py settings.py version.py scripts tests
          python -m unittest discover -s tests -v

      - name: Download FFmpeg and Deno for portable distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force tools | Out-Null

          $ffmpegUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile "tools/ffmpeg.zip"
          Expand-Archive -Path "tools/ffmpeg.zip" -DestinationPath "tools/ffmpeg" -Force
          $ffmpeg = Get-ChildItem "tools/ffmpeg" -Recurse -Filter "ffmpeg.exe" -File | Select-Object -First 1
          $ffprobe = Get-ChildItem "tools/ffmpeg" -Recurse -Filter "ffprobe.exe" -File | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg or FFprobe missing from downloaded archive" }
          Copy-Item $ffmpeg.FullName "tools/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "tools/ffprobe.exe"

          $denoUrl = "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $denoUrl -OutFile "tools/deno.zip"
          Expand-Archive -Path "tools/deno.zip" -DestinationPath "tools/deno" -Force
          $deno = Get-ChildItem "tools/deno" -Recurse -Filter "deno.exe" -File | Select-Object -First 1
          if (-not $deno) { throw "Deno missing from downloaded archive" }
          Copy-Item $deno.FullName "tools/deno.exe"

          & "tools/ffmpeg.exe" -version | Select-Object -First 1
          & "tools/deno.exe" --version | Select-Object -First 1

      - name: Render application icon
        shell: pwsh
        run: |
          python scripts/build_icon.py
          if ($LASTEXITCODE -ne 0) { throw "Failed to render icon" }
          if (-not (Test-Path "assets/app.ico" -PathType Leaf)) { throw "Missing app.ico" }

      - name: Build Windows onefile EXE with custom icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name YoutubeVideoDownloader --version-file windows_version_info.txt --collect-all yt_dlp_ejs --icon "assets/app.ico" --add-data "assets/app.svg;assets" main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          if (-not (Test-Path "dist/YoutubeVideoDownloader.exe" -PathType Leaf)) { throw "Missing onefile EXE" }
          $content = (& pyi-archive_viewer -l "dist/YoutubeVideoDownloader.exe" | Out-String)
          if ($LASTEXITCODE -ne 0 -or $content -notmatch "app\.svg") { throw "Icon SVG not embedded" }
          if ($content -match "deno\.exe") { throw "Deno must be external, not embedded" }

      - name: Create and verify flat portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Start with a clean staging directory: never mix an older onedir build
          # with the onefile release, even when the runner workspace is reused.
          $folder = "release/YoutubeVideoDownloader"
          if (Test-Path $folder) {
            Remove-Item -Recurse -Force $folder
          }
          New-Item -ItemType Directory -Force $folder | Out-Null

          $version = "$env:BASE_VERSION.$env:GITHUB_RUN_NUMBER"
          $archive = "YoutubeVideoDownloader-v$version-windows-x64.zip"
          if (Test-Path $archive) {
            Remove-Item -Force $archive
          }

          Copy-Item "dist/YoutubeVideoDownloader.exe" (Join-Path $folder "YoutubeVideoDownloader.exe")
          Copy-Item "tools/ffmpeg.exe" (Join-Path $folder "ffmpeg.exe")
          Copy-Item "tools/ffprobe.exe" (Join-Path $folder "ffprobe.exe")
          Copy-Item "tools/deno.exe" (Join-Path $folder "deno.exe")
          Copy-Item "LICENSE" (Join-Path $folder "LICENSE")
          Copy-Item "THIRD_PARTY_NOTICES.md" (Join-Path $folder "THIRD_PARTY_NOTICES.md")
          Copy-Item "assets/app.png" (Join-Path $folder "app-icon.png")
          Set-Content -Path (Join-Path $folder "VERSION.txt") -Value $version -Encoding utf8

          # Exactly these flat files are allowed in the published archive.
          # In particular _internal, nested directories and config.json must NOT ship.
          $expected = @(
            "YoutubeVideoDownloader.exe",
            "ffmpeg.exe",
            "ffprobe.exe",
            "deno.exe",
            "VERSION.txt",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "app-icon.png"
          )

          $files = @(Get-ChildItem -LiteralPath $folder -File)
          $subfolders = @(Get-ChildItem -LiteralPath $folder -Directory)
          if ($subfolders.Count -ne 0) {
            throw "Unexpected directories in distribution: $($subfolders.Name -join ', ')"
          }
          if ($files.Count -ne $expected.Count) {
            throw "Expected $($expected.Count) files, found $($files.Count)"
          }
          foreach ($name in $expected) {
            $file = Join-Path $folder $name
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing distribution file: $file" }
            if ((Get-Item $file).Length -le 0) { throw "Empty distribution file: $file" }
          }
          foreach ($file in $files) {
            if ($file.Name -notin $expected) { throw "Unexpected distribution file: $($file.Name)" }
          }

          # Archive CONTENTS, not the folder itself, avoiding an extra directory
          # level and any stale _internal left over from older onedir releases.
          Compress-Archive -Path (Join-Path $folder "*") -DestinationPath $archive -CompressionLevel Optimal -Force

          if (-not (Test-Path $archive -PathType Leaf)) {
            throw "Missing portable ZIP"
          }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive).Path)
          try {
            $entries = @($zip.Entries)
            if ($entries.Count -ne $expected.Count) {
              throw "ZIP contains $($entries.Count) entries, expected $($expected.Count)"
            }
            foreach ($entry in $entries) {
              if ($entry.FullName -notin $expected) {
                throw "Unexpected ZIP entry: $($entry.FullName)"
              }
              if ($entry.Length -le 0) {
                throw "Empty file in ZIP: $($entry.FullName)"
              }
            }
            foreach ($name in $expected) {
              if ($name -notin @($entries | ForEach-Object { $_.FullName })) {
                throw "Missing ZIP entry: $name"
              }
            }
            Write-Host "Verified ZIP contains exactly $($expected.Count) flat files, without _internal."
          }
          finally {
            $zip.Dispose()
          }
          Write-Host "Ready: $archive"

      - name: Upload portable program archive
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeVideoDownloader-v${{ env.BASE_VERSION }}.${{ github.run_number }}-windows-x64
          path: YoutubeVideoDownloader-v${{ env.BASE_VERSION }}.${{ github.run_number }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: windows-portable
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download versioned build artifact
        uses: actions/download-artifact@v4
        with:
          name: YoutubeVideoDownloader-v${{ env.BASE_VERSION }}.${{ github.run_number }}-windows-x64
          path: release

      - name: Create or update the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          zip="release/YoutubeVideoDownloader-${tag}-windows-x64.zip"
          test -s "$zip"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; updating ZIP (workflow rerun)."
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" \
              --target "$GITHUB_SHA" \
              --title "YoutubeVideoDownloader $tag" \
              --notes "Автоматический релиз Windows x64 из GitHub Actions pipeline #${GITHUB_RUN_NUMBER}. Скачайте ZIP, распакуйте всю папку и запустите YoutubeVideoDownloader.exe. Deno, FFmpeg и FFprobe находятся рядом с EXE; папка открывается после загрузки. HTTP-прокси по умолчанию выключен." \
              --latest
          fi
